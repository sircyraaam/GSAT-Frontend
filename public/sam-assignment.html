<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="../assets/js/include.js"></script>
  <script>GSATInclude('inc/head.html', { title: 'SAM Assignment' });</script>
</head>
<body data-page="sam-assignment" data-crumb="Site Assignment / SAM Assignment" data-allow="Admin" data-fallback="dashboard.html">

<div class="gsat-layout">
  <script>GSATInclude('inc/sidebar.html');</script>

  <div class="gsat-main">
    <script>GSATInclude('inc/navbar.html');</script>

    <main class="gsat-content">
      <div class="gsat-banner" id="gsat-banner" hidden></div>

      <div class="mb-3">
        <h1 class="gsat-page-title">SAM Assignment</h1>
        <div class="gsat-page-sub">Review the sites assigned to each SAM, or reassign a site when the manager changes.</div>
      </div>

      <div class="row g-3">

        <div class="col-lg-4"><div class="gsat-panel h-100">
          <div class="gsat-panel-head">
            <div class="fw-bold mb-2">SAM</div>
            <input type="text" id="sam-filter" class="form-control form-control-sm" placeholder="Filter SAMs">
          </div>
          <div class="gsat-panel-body" id="manager-list"></div>
        </div></div>

        <div class="col-lg-4"><div class="gsat-panel h-100">
          <div class="gsat-panel-head">
            <div class="fw-bold" data-bind="selectedSam"></div>
            <div class="small text-secondary" data-bind="siteCount"></div>
          </div>
          <div class="gsat-panel-body">
            <div id="site-list"></div>
            <div class="p-3 small text-secondary" id="site-empty" hidden>No sites assigned yet.</div>
          </div>
        </div></div>

        <div class="col-lg-4"><div class="gsat-panel h-100">
          <div class="gsat-panel-head">
            <div class="fw-bold">Reassign Site</div>
            <div class="small text-secondary mb-2">Search a site, then reassign it to the selected SAM.</div>
            <input type="text" id="site-search" class="form-control form-control-sm" placeholder="Search site code, trade area or city">
          </div>
          <div class="gsat-panel-body">
            <div id="result-list"></div>
            <div class="p-3 small text-secondary" id="result-hint">Type at least two characters to search.</div>
            <div class="p-3 small text-secondary" id="result-empty" hidden>No site matches that search.</div>
          </div>
        </div></div>

      </div>

      <div class="gsat-note mt-3" data-bind="summary"></div>

      <template id="tpl-manager-row">
        <div class="gsat-person-row">
          <div class="flex-fill min-w-0">
            <div class="small" data-bind="name"></div>
            <div class="small text-secondary" data-bind="scope"></div>
          </div>
          <span class="gsat-count-pill" data-bind="count"></span>
        </div>
      </template>

      <template id="tpl-site-row">
        <div class="gsat-person-row" style="cursor:default">
          <div class="flex-fill min-w-0">
            <div class="small fw-semibold" data-bind="code"></div>
            <div class="small" data-bind="tradeArea"></div>
            <div class="small text-secondary" data-bind="sas"></div>
            <div class="small text-secondary" data-bind="where"></div>
          </div>
          <div class="gsat-row-actions">
            <button type="button" class="btn btn-sm btn-outline-secondary site-move"
                    title="Reassign to another SAM" aria-label="Reassign to another SAM">
              <i class="bi bi-arrow-left-right"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger site-remove"
                    title="Remove this assignment" aria-label="Remove this assignment">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </template>

      <template id="tpl-result-row">
        <div class="gsat-person-row" style="cursor:default">
          <div class="flex-fill min-w-0">
            <div class="small fw-semibold" data-bind="code"></div>
            <div class="small" data-bind="tradeArea"></div>
            <div class="small text-secondary" data-bind="owner"></div>
          </div>
          <button type="button" class="btn btn-sm btn-success site-reassign">Reassign</button>
          <button type="button" class="btn btn-sm btn-light site-assigned" disabled hidden>Assigned</button>
        </div>
      </template>
    </main>

    <script>GSATInclude('inc/footer.html');</script>
  </div>
</div>

<script src="../assets/js/vendor/jquery.min.js"></script>
<script src="../assets/js/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/gsat-mapping.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/pages/sam-assignment.js"></script>
</body>
</html>
